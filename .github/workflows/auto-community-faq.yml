# 社区常见问题自动补充并提 PR（多产品 matrix）
#
# 来源: 从芝麻会话（社区小助手名下各产品的交流群）提取最近一周的
#       「客户提问 → 部门同事解答」问答对，由大模型按官方文档核实并改写，
#       追加到 content/<product>/<version>/zh/faq/community_faq.mdx，通过 PR 提交，不直接改动 main。
#
# 支持产品: jumpserver / dataease / maxkb / 1panel / sqlbot / cordys
#   - 每个产品一个 matrix job，**互不干扰**：独立分支、独立诊断产物、独立 PR；
#   - 产品清单与各自参数（文档目录 / 固定分支 / 关键词 / 排除群 / 版本口径 / md 数量下限）
#     由脚本里的 PRODUCTS 表统一定义（.github/scripts/community_faq.py），本文件不再重复列举；
#   - matrix 由 `community_faq.py --matrix` 生成，写法与 auto-changelog-multi.yml 保持一致；
#   - 默认只跑 PRODUCTS 里 enabled=true 的产品；workflow_dispatch 可用 product 输入框
#     传逗号分隔的白名单（如 `dataease,maxkb`）灰度试跑。
#
# 配套脚本: .github/scripts/community_faq.py（单文件自包含，仅用 Python 标准库；
#           退出码 0=完成 / 1=取数失败 / 2=配置或参数错误 / 3=无新增条目
#                 / 4=大模型环节失败（网关不可达、key 无效、模型无返回）
#                 / 5=MDX 安全护栏拦截（内容未通过 MDX 编译，页面未写入））
#
# 内容安全护栏（2026-10-10 事故后新增）:
#   模型生成的正文曾出现裸尖括号占位符「在<参数>中配置」，MDX 把它当 JSX 标签解析，
#   导致 Deploy to Aliyun OSS 的 npm run build 失败、整站发布中断 —— 而坏内容此时已合入 main。
#   现在脚本在写回页面前做三重防护：
#     1) 提示词层：PASS2_SYSTEM 明令禁止裸尖括号占位符 / 裸 HTML 标签 / 裸链接；
#     2) 转义层：sanitize_entry 把代码块之外的裸 < 与 { 转成 HTML 实体（渲染不变、内容不丢）；
#     3) 校验层：逐条 + 整页用 @mdx-js/mdx 真实编译（本环境无 node_modules 时退化为正则扫描），
#        整页不过则返回退出码 5 且**不写入页面**。
#
# 部署位置（重要）:
#   本 workflow 与 .github/scripts/community_faq.py 部署到**官方仓库**
#   fit2cloud-dev/fit2cloud-docs，在 upstream 内运行、并在 upstream 内开 PR。
#   因此**不需要任何跨仓库 PAT**：PR 就是同一个仓库里的「新分支 → main」，
#   用 Actions 内置的 GITHUB_TOKEN 即可。
#
#   upstream 仓库侧需要配置:
#     1. Settings -> Actions -> General -> Workflow permissions 选 "Read and write"；
#     2. 同一页勾选 "Allow GitHub Actions to create and approve pull requests"
#        —— 不勾选时 GITHUB_TOKEN 无法创建 PR，会直接报错；
#     3. Secrets: ZHIMA_BASE_URL / ZHIMA_ACCOUNT / ZHIMA_PASSWORD / LLM_API_KEY
#        （以上四项**都是必填**；另可选 ZHIMA_DEPT_STAFF；
#          公司仓库建议配成组织级 Secret）。
#        LLM_API_KEY = 百度千帆的 Bearer Token（形如 bce-v3/ALTAK-xxxx/yyyy），
#        直接配在 Secret 里即可，**不要写进本文件**；
#        ⚠️ 这是本工作流**唯一**需要配置的模型相关项：网关
#        https://qianfan.baidubce.com/v2 与模型名 deepseek-v4.1-flash 已在下方 env 里
#        写死，不再读仓库 Variables（历史配过同名 Variables 会静默覆盖默认值、排查困难）。
#        ⚠️ deepseek-v4.1-flash 是**推理型模型**：思维链 token 与正文共享 max_tokens 预算，
#        实测开启思考时 600 预算里 582 都被 reasoning 吃掉、content 直接为空。
#        本任务的调用都是「按固定格式吐 JSON」，思维链无收益，因此脚本默认发
#        thinking={"type": "disabled"} 把它关掉（实测同样请求：600 → 38 token）。
#        如需临时打开，把仓库 Variables 的 LLM_DISABLE_REASONING 设为 0 即可。
#        ZHIMA_DEPT_STAFF = 官方人员名单 JSON，如 [{"name":"张三"},{"name":"李四","aliases":["小李"]}]。
#        ⚠️ 它**不是过滤白名单**，而是「官方人员」身份标记：名单内的人的答复被标为高信任来源，
#        名单外同事的答复一样保留（标为低信任），两级都交给模型按分级标准审核。
#        未配置时，所有员工答复一律按「普通同事答复」处理。
#        缺项时 workflow 会在 Preflight 步骤直接失败并指明缺哪一项，不会跑到一半才报错。
#
# 与 fork 的关系:
#   - fork 只是本地开发副本，本 workflow 不做任何 fork ↔ upstream 的推送；
#   - fork 与 upstream 的同步方向是「fork 拉取 upstream」，由
#     .github/workflows/sync-fork.yml 部署在 **fork** 的 main 上完成
#     （或直接用 GitHub 界面的 "Sync fork" 按钮）。
#     ⚠️ 不要把 sync-fork.yml 也提交到 upstream：在 upstream 里它等于自己同步自己，无意义。
#
# 运行环境（重要）:
#   - `ubuntu-latest` = **GitHub 托管 runner，机房在境外**。
#     ⚠️ 境外 runner **访问不了「仅国内可达」的外部服务**：2026-09-23 实测，芝麻平台可达
#     （取数 288 次请求 / 0 失败 / 321 条问答对），但当时用的模型网关 ai.fit2cloud.cn
#     （解析到国内电信公网 IP 119.147.33.142）**TCP 连接超时**（Errno 110）。
#     该限制与脚本、账号、负载、请求大小都无关，也**不是偶发**：同一地址在国内本机
#     TCP/TLS/HTTP 全通（HTTP 401 = 服务活着），而在 runner 上三次尝试全部连不上；
#     **加大超时无效**（是 TCP 连接建不起来，不是响应慢）。
#     ✅ 因此默认网关已改为**公网可达**的百度千帆 v2（qianfan.baidubce.com），
#     托管 runner 不再需要为「模型网关跨境不通」而切到国内自托管 runner。
#     ⚠️ 若把下方 env 里的 LLM_BASE_URL 换回国内自建网关，上面这段跨境限制会重新生效。
#   - Preflight 里的连通性自检会把「芝麻」与「模型网关」**分别**探明并打印解析到的 IP，
#     15 秒内给出结论，不必等取数跑完。
#   - **国内自托管 runner（跨不过跨境链路时用）**：不要改本文件的 env 网关地址，只在仓库 Variables 里设
#     RUNNER_LABELS = ["self-hosted","f2c"]，本任务就会落到那台机器上；不设则用托管 runner。
#     ⚠️ 该机需 Python ≥ 3.7（脚本用了 3.7+ 语法，3.6 会语法报错），且 glibc 需 2.28+
#     （actions/checkout 等 node20 action 的要求）→ 老系统（如 CentOS 7 / glibc 2.17）
#     请用**容器方式**跑 runner，不要裸装。
#   - 安全提示：本 workflow 只挂 workflow_dispatch 与 schedule，**不接受 PR 触发**，
#     因此自托管 runner 不会被外部 PR 利用；但该机仍是「仓库写权限 = 该机执行权限」，
#     故 runner 容器**不要挂载 /var/run/docker.sock**。
#
# 分支策略:
#   - **每个产品一个固定分支**（来自 PRODUCTS[key]['branch']）：
#       jumpserver -> chore/weekly-community-faq        （历史沿用，不可改名，否则线上任务会另开分支）
#       其它产品   -> chore/weekly-community-faq-<product>
#     ⚠️ 分支名必须按产品区分：origin 与 upstream 各自都存在 chore/weekly-community-faq，
#     多个产品共用同名分支会互相覆盖对方的页面（跨仓库更会撞车）。
#   - 固定分支每次以 main 最新为基线重建（**不做 rebase**，见下），
#     页面内容**永远百分之百取自 main**；上期分支只作为「待续接条目的来源」，由脚本做条目级续接
#     （**永不整份覆盖、永不文件级合并**）；
#   - PR 以**草稿态**创建，供人工核对内容与措辞后再合并；
#   - 不直接改 main。
#
# 固定分支的维护方式（2026-10-12 修复，务必先读）:
#   本任务只改一个文件（content/<product>/<version>/zh/faq/community_faq.mdx），且全程不做 rebase（避免拉完整历史）。
#   做法是：以 origin/main 为基线新建固定分支，**当前页面一律取自 main**，
#   上期分支只被当作「待续接条目的来源」，由脚本做**条目级**续接（见下）。
#
#   ⚠️ 两次踩坑记录，改这一步骤前必须读完：
#   [坑 1｜整份覆盖] 最初是 `git checkout FETCH_HEAD -- <页面>`——用上期分支的**整份**文件
#     覆盖当前工作区。上期分支是个「世代相传的快照」，凡是 main 上已有、而上期分支还停在旧版
#     的内容，都会被静默回退。实测事故：前端标题被还原成旧名（`常见问题`→`社区常见问题`）、
#     已改好的正文错别字（`DOMAINS`←`DOAMINS`）被改回旧版，且**每周复发**。
#   [坑 2｜三方合并] 改用行级三方合并（git merge-file，base=上期基线）同样无效。实测证明
#     上期基线（上期分支父提交里的该页面）与当前 main 的该页面**逐字节相同**；三方合并里
#     base == ours 时，theirs 的每一处差异（正是那些回退内容）都会被当成「新增改动」重放回来。
#     根因：这个长寿命累积分支没有干净的 base，差异里混着回退，任何文件级合并都无法把
#     「上期真正新增的条目」和「陈旧回退」分开。
#
#   → 最终方案：**文件级合并不做，只做条目级续接**。workflow 只把上期分支的该页面导出到
#     临时文件（绝不写入工作区），由 community_faq.py 的 `--reuse-page` 解析出其中多出来的
#     `### N.N` 条目块，按当前页面判重后追加。页面其余部分（front matter、标题、正文）
#     百分之百来自最新 main。脚本侧实现在 `reuse_entries_from_page()`，那里也记了这段事故。
#   ⚠️ 改动本步骤前务必同时意识到：① 不做 rebase 是硬约束；② 不得退回文件级覆盖/合并。
#   长期正解：合入 PR 后删除固定分支（开启仓库 "Automatically delete head branches"），
#     让 `--reuse-page` 自然落空，避免长期累积分支越拖越脏。
#
# 跨境链路（重要，2026-09-24 实测）:
#   - 本仓库当前版本就 ~1.9GB / 8393 个文件、全历史 pack ~1.4GB，而本任务只需不到 1MB
#     （.github/ + 各 <product>-docs 下所有 md）。国内自托管 runner 到 GitHub 是「小请求快、
#     大流量被掐」：实测 curl 226MB 中途 SSL EOF、git fetch 全量 13 分钟后 curl 56 / early EOF。
#   - 因此 checkout 采用**浅历史 + 部分克隆 + 稀疏检出**（见该步骤注释），且**全程不做 rebase**
#     —— rebase 需要两个分支的公共祖先，会强迫拉完整历史。
#   - 稀疏范围从「只含 jumpserver-docs」放宽为「所有 content/<product>/<version>/zh 下的 md/mdx」：
#     6 个产品的 md 合计约 3.1MB，相对全量 1.9GB 仍省掉 99.8%；
#     之所以一次全量检出而不是按 matrix 变量动态指定产品目录，是因为
#     actions/checkout 的 sparse-checkout 用的是静态字符串，动态拼 product 会让
#     retry-checkout 步骤（直接跑 git-helper）与环境变量两处都要同步改写，容易写歪。
#     ⚠️ 改动 checkout 与「Prepare fixed branch」前务必意识到这点，否则会重新引入 GB 级传输。
#
# 触发与时区（重要）:
#   - 定时：每周一 03:00（北京时间）→ cron 按 UTC 写 '0 19 * * 0'（周日 19:00 UTC）；
#   - **必须显式设置 TZ=Asia/Shanghai**：GitHub runner 默认跑在 UTC，而「周一 03:00 北京」
#     落在 UTC 的周日，脚本里的 date.today() 会退回成周日，导致数据窗口与「周一」错位；
#   - 回看窗口 8 天（含今天）：比 7 天多留一天，用来补回上一次运行当天 03:00 之后的消息，
#     否则「上周一 03:00–23:59」这一段两次运行都覆盖不到；
#   - 6 个产品**并行**跑（fail-fast: false + max-parallel: 2）：单个产品失败不影响其它产品，
#     同时把并发压在 2 以内，避免自托管 runner 上同时开 6 个进程互相抢带宽、放大跨境链路抖动；
#   - 计时提醒：原单产品 job 超时 40 分钟。改成 6 产品后**每产品仍是 40 分钟上限**
#     （矩阵各 job 的超时是独立的），所以总线时长取决于并发度，不是 6×40。
#   - GitHub 的 schedule 在整点高负载时可能被延迟、极端情况下会被丢弃，
#     因此同时保留手动触发；窗口按日期计算，延迟几十分钟不影响数据完整性。
#
# 注意:
#   - schedule 只在仓库默认分支(main)上生效；放在功能分支时只能用 workflow_dispatch。
#   - 上期 PR 若是 **squash 合并**：本 workflow 不依赖提交历史（以 main 为基线重建分支 +
#     从基线快照里取上期新增条目），因此 squash 合并不再引起任何冲突或历史问题。
#   - 在 fork 上测试时：fork 的定时任务默认关闭，用 workflow_dispatch 手动跑即可；
#     ⚠️ 不要在 fork 上启用定时，否则 fork 与 upstream 会各开一个重复的 PR。
#
# 收录口径（见脚本内 PASS1/PASS2 提示词，可按需调整）:
#   - 选题以「长期复用价值」为准，不按频率：版本升级/兼容性/功能变化/环境要求/报错根因/
#     参数限制/使用前提等高价值问题优先；单次特殊环境问题、纯操作步骤、文档已有完整教程的不收。
#     高频≠必须收录，低频但高价值也可收录（min_count 已弱化为参考值）。
#   - **版本口径按产品**：由 PRODUCTS[key]['version_scope'] 决定（jumpserver=V5、dataease=v3、
#     maxkb=v2、1panel=v2、sqlbot=v1、cordys=v1），未标注版本的一律按该产品当前主线处理。
#     ⚠️ 这几个取值需人工确认；口径写错会静默漏收或误收（详见 PRODUCTS 表上方注释）。
#   - 事实来源分级：官方文档 > 官方 FAQ > 官方人员明确答复 > 普通同事明确答复 > 用户描述 > AI 自身知识；
#     官方人员（ZHIMA_DEPT_STAFF 名单内）的答复放宽一档：给出可执行处置即可采纳；
#     普通同事答复必须给出「现象 → 原因/处理」的明确结论才采纳 ——
#     猜测 /「建议试试」/ 只给排查方向的一律放弃生成（body 置空）。
#     版本/参数/命令/路径必须逐字来自依据文本，不得自造。
#   - 「官方文档里没有」不再作为排除理由：文档缺失 + 官方人员已明确答复，
#     恰恰是社区 FAQ 最该沉淀的一类（也是本页相对使用手册最大的价值）。

name: Auto Community FAQ (multi-product)

on:
  workflow_dispatch:
    inputs:
      product:
        description: "产品白名单（逗号分隔，如 dataease,maxkb）；留空=跑 PRODUCTS 表里全部启用产品"
        required: false
        default: ""
      days:
        description: "回看天数（含今天）"
        required: false
        default: "8"
      max_items:
        description: "一个 PR 里条目总数的上限（含上期续接，超过 5 会被压到 5）"
        required: false
        default: "5"
      min_items:
        description: "引导模型至少选几条（只作引导，不够格时照实少选）"
        required: false
        default: "3"
      min_count:
        description: "（已弱化）出现次数仅作参考，选题以长期复用价值为准"
        required: false
        default: "2"
      dry_run:
        description: "只预览不提交（仍会调用模型）"
        type: boolean
        default: false
      draft:
        description: "以草稿方式创建 PR"
        type: boolean
        default: true
  schedule:
    # 每周一 03:00（北京时间）= 周日 19:00 UTC
    - cron: "0 19 * * 0"

permissions:
  contents: write
  pull-requests: write

concurrency:
  # 全局单组：任何两次触发（定时全量 vs 手动单产品）都串行执行。
  # ⚠️ 不能按 product 分组（旧写法 community-faq-${{ product }}）：定时全量跑出
  # community-faq-all 组、手动单产品跑出 community-faq-jumpserver 组，两组互不阻塞，
  # 两个 run 会对同一产品的固定分支同时 push --force-with-lease，后推者静默覆盖先推者。
  # 串行的代价是多等一轮（单次 run 约 10-20 分钟），可接受。
  # matrix 内部的并发已由 strategy.max-parallel: 2 控制，不受本组影响。
  group: community-faq
  cancel-in-progress: false

env:
  # 全流程按北京时间计算日期：脚本的 date.today() 依赖它
  # （周一 03:00 北京 = UTC 周日，不设 TZ 会让窗口与「周一」错位，见文件头说明）
  TZ: Asia/Shanghai
  BASE_BRANCH: main
  SCRIPT: .github/scripts/community_faq.py
  # ⚠️ BRANCH / FAQ_PAGE / PRODUCT_KEYWORD 这三个**不能**写在 job 级 env 里：
  #    它们随矩阵产品变化，而 job 级 env 不支持表达式引用 matrix。
  #    - BRANCH     ：由 Preflight 步骤从 PRODUCTS 表解析后写入 $GITHUB_ENV；
  #    - FAQ_PAGE   ：由脚本自己推导（PRODUCTS[key]['docs'] + faq_rel），workflow 不再重复定义；
  #    - 群名关键词 ：默认取自 PRODUCTS 表；下面的 PRODUCT_KEYWORD 只是历史兼容覆盖口。
  ZHIMA_BASE_URL: ${{ secrets.ZHIMA_BASE_URL }}
  ZHIMA_ACCOUNT: ${{ secrets.ZHIMA_ACCOUNT }}
  ZHIMA_PASSWORD: ${{ secrets.ZHIMA_PASSWORD }}
  ZHIMA_DEPT_STAFF: ${{ secrets.ZHIMA_DEPT_STAFF }}
  ZHIMA_SCOPE_STAFF_USERID: ${{ vars.ZHIMA_SCOPE_STAFF_USERID || 'SheQuXiaoZhuShou' }}
  # 网关与模型名直接写死，不复用仓库 Variables —— 避免历史 Variables 静默覆盖默认值。
  # 改网关/换模型时改这里，同时把脚本里的 DEFAULT_LLM_BASE_URL / DEFAULT_LLM_MODEL 一起改。
  LLM_BASE_URL: https://qianfan.baidubce.com/v2
  LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
  LLM_MODEL: deepseek-v4.1-flash
  # 默认关闭推理型模型的思维链（1=关闭）。reasoning token 计入 max_tokens，
  # 本任务只需固定格式的 JSON，思考纯属浪费预算。设 0 可临时打开（见文件头说明）。
  # 此项保留 Variables 覆盖能力，方便不改代码就能临时打开思考。
  LLM_DISABLE_REASONING: ${{ vars.LLM_DISABLE_REASONING || '1' }}
  # 群名过滤关键词覆盖项；**留空**即每个产品各自用 PRODUCTS 表里的 keyword。
  # 仅当需要临时改口径时（如某产品群名带了额外前缀）才把仓库变量 PRODUCT_KEYWORD 配上。
  PRODUCT_KEYWORD: ${{ vars.PRODUCT_KEYWORD || '' }}

jobs:
  # 先解析出要跑哪些产品，再按矩阵展开 —— 与 auto-changelog-multi.yml 同一套写法，
  # 好处是「该跑哪些产品」只在工件（脚本 PRODUCTS 表）里维护一份，workflow 不抄第二遍。
  list:
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    outputs:
      products: ${{ steps.resolve.outputs.products }}
    steps:
      # 该 job 只需脚本本身，但 checkout 的 sparse 输入是静态的：
      # 写成「所有 content/<product>/<version>/zh 下的 md/mdx」即可一次覆盖全部产品（合计约 3.1MB，仍是轻量）。
      - name: Checkout (script only)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/

      # 不依赖 actions/setup-python（runner 自带 python3 即可，少一个跨境下载点）
      - name: Resolve product matrix
        id: resolve
        run: |
          set -e
          if ! python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 7) else 1)' 2>/dev/null; then
            echo "::error::runner 上的 python3 不可用或版本过低（需 >= 3.7）：$(python3 -V 2>&1)"
            exit 1
          fi
          products=$(python3 "${SCRIPT}" --matrix "${{ github.event.inputs.product }}")
          echo "Products: ${products}"
          echo "products=${products}" >> "$GITHUB_OUTPUT"

  community-faq:
    needs: list
    # 白名单里写了未知产品时 --matrix 会返回空数组，这里直接整体跳过，不再展开空矩阵
    if: ${{ needs.list.outputs.products != '[]' }}
    # runner 由**仓库 Variables** 控制，文件里不写死 —— fork 与 upstream 内容保持一致，
    # 各自仓库按需配置（不配即为默认值，行为与从前完全相同）：
    #   未配置 RUNNER_LABELS            -> ["ubuntu-latest"]（GitHub 托管，境外）
    #   RUNNER_LABELS=["self-hosted","f2c"] -> 落到国内自托管 runner（见文件头「运行环境」）
    # 默认模型网关是公网可达的百度千帆 v2（已写死在 env 里，不受 Variables 影响），
    # 托管 runner 可直接用；只有把 env 里的 LLM_BASE_URL 换成**仅国内可达**的自建网关
    # （如 ai.fit2cloud.cn，国内电信 IP）时，托管 runner 才会连不上，届时再切国内自托管 runner。
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 40
    strategy:
      # 单产品失败不连坐：6 个产品并行时，某个产品取数失败不应把其它已成功的结果一起回滚/标记失败
      fail-fast: false
      # 并发上限 2：自托管 runner 上同时开 6 个进程会互相抢带宽、放大跨境抖动；
      # 而每个产品本身已是「取数 + 两轮模型」的长任务。2 是吞吐与稳定性的折中。
      max-parallel: 2
      matrix:
        product: ${{ fromJson(needs.list.outputs.products) }}

    steps:
      # ⚠️ 跨境链路优化（2026-09-24）：本仓库当前版本就 ~1.9GB / 8393 个文件，全历史 pack ~1.4GB，
      # 而本任务真正需要的只有 .github/（脚本）与各 <product>-docs 下的 md —— 合计约 3.1MB。
      # 所以必须「浅历史 + 部分克隆 + 稀疏检出」三者齐上，少任何一个都会退化成 GB 级传输：
      #   fetch-depth: 1    —— 不拉历史。原先写 0（为了后面 rebase），会拉全部分支+标签+完整历史，
      #                        2026-09-24 实测必失败：curl 56 GnuTLS recv error / early EOF，13 分钟被掐。
      #   filter: blob:none —— 只取本次提交的 commit/tree，不下载 blob（文件内容按需再取）
      #   sparse-checkout   —— 工作区只物化下面这些范围，于是「按需取」的 blob 也只有这 ~3.1MB
      # 配套：本 workflow 已**取消 rebase**（见 Prepare fixed branch），因此不再需要完整历史。
      # 另：不再使用 actions/setup-python —— runner 自带 python3 即可，少一个跨境下载点。
      # 跨境抖动重试（2026-10-08）：本仓库到 GitHub 的跨境链路是「概率性被掐」——
      # 2026-10-05 定时运行实测：即便已按上面的浅克隆+稀疏检出压到 0.92MB，checkout
      # 仍在 ~4 分钟后失败（TLS EOF / early EOF 一类），随后所有步骤 skipped。
      # 同一套配置此前多次跑通过，属链路抖动而非配置错误，故失败后等待再重试，
      # 最多 4 次尝试、间隔 30s。action 失败会直接终止步骤，用 continue-on-error
      # 把失败转成输出，由后面的「Checkout failed」步骤在重试用尽后如实报错。
      # 注：重试会复用同名 action 缓存目录，若上次失败留下半截仓库导致重试反复失败，
      # 退路是在重试前 rm -rf "$GITHUB_WORKSPACE"/* 清一次（本次先不加，观察）。
      - name: Checkout (partial clone + sparse)
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 1
          filter: blob:none
          # 稀疏范围 = 脚本本体 + **所有 <product>-docs 下全部 md**（不能只取各自 faq/）：
          #   第二轮成稿会 read_text 读取被引用文档的**全文**喂给模型（见 community_faq.py
          #   的 compose_entry），所以这些 md 必须真实存在。各产品目录里图片占大头
          #   （jumpserver 一家就 73.85MB）、md 仅合计约 3.1MB，故用非 cone 模式按扩展名精确包含。
          #   实测（2026-09-24, a6704ab，当时仅 jumpserver）：.github 0.11MB + 192 个 md 0.81MB
          #   = 0.92MB，相对全量 1475MB 省掉 99.94%；扩到 6 个产品后仍约 3.1MB（省掉 99.8%）。
          #   ⚠️ 这里刻意**不按 matrix.product 动态指定目录**：sparse-checkout 是静态字符串，
          #     动态拼接会让 retry-checkout 步骤里的 INPUT_SPARSE_CHECKOUT 与环境变量两处
          #     都要同步改写，容易写歪；一次全量检出的代价只有约 3MB。
          #   退路：若非 cone 模式在下游（git checkout 单文件等）出问题，改回 cone 模式并把范围
          #   换成各 <product>-docs（约 150MB+）即可，功能等价（代价是多传图片）。
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /content/*/*/zh/*.md
            /content/*/*/zh/**/*.md
            /content/*/*/zh/*.mdx
            /content/*/*/zh/**/*.mdx
            /content/*/*/zh/faq/community_faq.pending.json

      # 重试循环：actions/checkout 自身没有重试参数，失败后在这里重跑它。
      # 重跑方式：直接执行 runner _tool 目录里已下载的 checkout 入口脚本
      # （RUNNER_TOOL_CACHE/checkout/<版本>/<arch>/bin/git-helper 所在目录），
      # 环境变量（GITHUB_*、INPUT_*）由 runner 原样保留，等价于再跑一次 action。
      # 若找不到入口脚本（缓存路径随 runner 版本变化），退化为 curl 下载 action 仓库再跑。
      - name: Retry checkout on transient failure
        id: retry-checkout
        if: ${{ steps.checkout.outcome == 'failure' }}
        env:
          INPUT_REF: ${{ env.BASE_BRANCH }}
          INPUT_FETCH_DEPTH: 1
          INPUT_FILTER: blob:none
          INPUT_SPARSE_CHECKOUT_CONE_MODE: "false"
          # ⚠️ 必须与上面 Checkout 步骤的 sparse-checkout 逐字一致（同样的通配集合），
          #    否则重试成功后会检出「另一套」文件，第二轮读文档原文时就少文件了。
          INPUT_SPARSE_CHECKOUT: |
            /.github/
            /content/*/*/zh/*.md
            /content/*/*/zh/**/*.md
            /content/*/*/zh/*.mdx
            /content/*/*/zh/**/*.mdx
            /content/*/*/zh/faq/community_faq.pending.json
        run: |
          set -e
          # 定位已下载的 actions/checkout（尝试 v4 下所有已缓存版本，取最新）
          entry="$(find "${RUNNER_TOOL_CACHE}/checkout" -maxdepth 4 -name git-helper -type f 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "${entry}" ]; then
            echo "::warning::未找到已缓存的 checkout 入口脚本，改用 curl 重新下载 actions/checkout"
            tmp="$(mktemp -d)"
            curl -fsSL --retry 3 -o "${tmp}/checkout.tar.gz" \
              https://github.com/actions/checkout/archive/refs/tags/v4.2.2.tar.gz
            tar -xzf "${tmp}/checkout.tar.gz" -C "${tmp}"
            ( cd "${tmp}"/checkout-* && npm ci --omit=dev >/dev/null 2>&1 || true )
            entry="${tmp}"/checkout-*/dist/index.js
          fi
          echo "checkout 入口：${entry}"
          delay=30
          for attempt in 2 3 4; do
            echo "── checkout 重试 第 ${attempt}/4 次（等待 ${delay}s 让链路恢复）──"
            sleep "${delay}"
            delay=$((delay * 2))
            # 清理上次失败留下的半截仓库，避免 git 状态污染重试
            rm -rf "${GITHUB_WORKSPACE:?}/.git" "${GITHUB_WORKSPACE:?}"/* 2>/dev/null || true
            # 工作区清空后 git-helper 需要目录存在
            cd "${GITHUB_WORKSPACE}"
            if node "${entry}"; then
              echo "重试成功（第 ${attempt} 次）"
              exit 0
            fi
            echo "::warning::第 ${attempt} 次 checkout 仍失败"
          done
          echo "::error::checkout 连续 4 次失败 —— 跨境链路当前不可用（非配置问题）。"
          echo "::error::若持续失败：考虑把 sparse 范围改成 cone 模式整目录（见 Checkout 步骤注释的退路），或给该 runner 配置代理。"
          exit 1

      # checkout 失败（含重试用尽）时，让 job 明确失败在这里，而不是让后续步骤
      # 以「文件不存在」之类的误导性报错继续。
      - name: Fail fast if checkout never succeeded
        if: ${{ steps.checkout.outcome == 'failure' && steps.retry-checkout.outcome != 'success' }}
        run: |
          echo "::error::checkout 最终失败，无法继续。"
          exit 1

      # 配置自检：缺东西就立刻失败并指明缺哪一项，避免跑到取数阶段才报错
      # 同时把当前矩阵产品的配置（文档目录 / 固定分支 / FAQ 页面）解析出来供后续步骤复用，
      # 避免 workflow 里再抄一份产品参数（单一事实来源是脚本的 PRODUCTS 表）。
      - name: Preflight
        id: preflight
        env:
          # 步骤级 env 才能引用 matrix（job 级 env 不支持表达式）
          PRODUCT: ${{ matrix.product }}
        run: |
          set -e
          cfg=$(python3 "${SCRIPT}" --product "${{ matrix.product }}" --print-config)
          echo "产品配置：${cfg}"
          DOCS_DIR=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["docs"])' "${cfg}")
          BRANCH=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["branch"])' "${cfg}")
          MIN_MD=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["min_md"])' "${cfg}")
          FAQ_REL=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["faq_rel"])' "${cfg}")
          # 双复核责任人：产品负责人（各产品固定）+ 当周社区值班人（按周轮换，见脚本 ONCALL_ROTA）。
          # 两者都取自 PRODUCTS 表 / 轮换表，workflow 不另抄一份名单。
          OWNER_LOGIN=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1]).get("owner",""))' "${cfg}")
          ONCALL_LOGIN=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1]).get("oncall",""))' "${cfg}")
          # FAQ 页面路径同样取自 PRODUCTS 表（docs + faq_rel），workflow 不另抄一份
          FAQ_PAGE="${DOCS_DIR}/${FAQ_REL}"
          echo "产品=${PRODUCT} / 文档目录=${DOCS_DIR} / FAQ 页面=${FAQ_PAGE} / 固定分支=${BRANCH} / md 下限=${MIN_MD}"
          echo "双复核：产品负责人=${OWNER_LOGIN:-未配置} / 当周社区值班人=${ONCALL_LOGIN:-未配置}"
          missing=""
          for name in ZHIMA_BASE_URL ZHIMA_ACCOUNT ZHIMA_PASSWORD LLM_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::缺少必需配置 ${name}（仓库 Settings → Secrets and variables → Actions 里添加）"
              missing="${missing} ${name}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "缺失：${missing}"
            exit 1
          fi
          echo "必需配置齐全：ZHIMA_BASE_URL / ZHIMA_ACCOUNT / ZHIMA_PASSWORD / LLM_API_KEY"
          if [ -z "${ZHIMA_DEPT_STAFF}" ]; then
            echo "::warning::未配置 ZHIMA_DEPT_STAFF，所有员工答复一律按「普通同事答复」处理（不区分高信任来源，名单外同事的答复本就都会保留）"
          else
            echo "已配置 ZHIMA_DEPT_STAFF（官方人员名单）：名单内的答复标记为高信任来源，名单外同事的答复仍保留"
          fi
          echo "模型：${LLM_MODEL} / 网关：${LLM_BASE_URL}"
          echo "运行环境：${RUNNER_NAME:-?} / ${RUNNER_OS:-?} ${RUNNER_ARCH:-?} / $(python3 -V 2>&1)"
          # 不再依赖 actions/setup-python，故自行校验解释器（脚本用到 3.7+ 语法，3.6 会 SyntaxError）
          if ! python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 7) else 1)' 2>/dev/null; then
            echo "::error::runner 上的 python3 不可用或版本过低（需 >= 3.7）：$(python3 -V 2>&1)"
            exit 1
          fi
          # 稀疏检出防呆：第二轮成稿要读该产品文档目录下被引用文档的原文，若 md 数量异常偏少
          # （例如 sparse 范围误写成只含 faq/），脚本会静默拿不到依据 —— 这里提前拦下。
          # 阈值取 PRODUCTS[key]['min_md']：各产品文档体量差异很大（jumpserver 198 vs cordys 57），
          # 统一写 50 会让小产品误报（cordys 正常也只有 57）。
          md_count=$(find "${DOCS_DIR}" \( -name '*.md' -o -name '*.mdx' \) 2>/dev/null | wc -l)
          echo "检出文档：${DOCS_DIR} 下 ${md_count} 个 md/mdx"
          if [ "${md_count}" -lt "${MIN_MD}" ]; then
            echo "::error::${DOCS_DIR} 只检出 ${md_count} 个 md（该产品下限 ${MIN_MD}）—— 稀疏检出范围可能不对，第二轮读文档原文会失败。"
            exit 1
          fi
          {
            echo "docs_dir=${DOCS_DIR}"
            echo "branch=${BRANCH}"
            echo "page=${FAQ_PAGE}"
          } >> "$GITHUB_OUTPUT"
          # 导出到 GITHUB_ENV：后续所有步骤就能像从前一样直接用 ${BRANCH} / ${FAQ_PAGE}，
          # 不必把这两个变量改成 `${{ steps.preflight.outputs.xxx }}` 逐处替换（改动面更小）。
          {
            echo "BRANCH=${BRANCH}"
            echo "FAQ_PAGE=${FAQ_PAGE}"
            echo "DOCS_DIR=${DOCS_DIR}"
            echo "OWNER_LOGIN=${OWNER_LOGIN}"
            echo "ONCALL_LOGIN=${ONCALL_LOGIN}"
          } >> "$GITHUB_ENV"
          # 校验页面文件确实存在：稀疏检出错时在这里报错，比在「写回页面」时才炸清楚得多
          if [ ! -f "${FAQ_PAGE}" ]; then
            echo "::error::FAQ 页面 ${FAQ_PAGE} 不存在 —— 该产品可能还没建页面（先合入页面骨架 PR），或稀疏检出范围不对。"
            exit 1
          fi

          # 出网与外部依赖连通性自检：在发起 288 次取数请求之前就暴露网络问题，
          # 并把「芝麻」与「模型网关」**分别**探明 + 打印解析到的 IP —— 只有一边不通时
          # 一眼就能看出是哪一边（2026-09-23 实测：芝麻通、模型网关跨境超时，
          # 却要等取数跑完 5 分钟才炸，且报错还指向了错误环节）。
          python3 - <<'PY'
          import json, os, socket, sys, urllib.error, urllib.request


          def probe(base, path, headers):
              """探测可达性，返回 (是否可达, HTTP 状态码, 描述, 响应体)。
              拿到任何 HTTP 响应（含 4xx/5xx）都算「可达」——那说明网络通，问题在上层。"""
              if not base:
                  return False, None, "未配置", ""
              base = base.rstrip("/")
              host = base.split("//", 1)[-1].split("/", 1)[0].split(":")[0]
              try:
                  ips = sorted({i[4][0] for i in socket.getaddrinfo(host, None, proto=socket.IPPROTO_TCP)})
              except Exception as err:
                  return False, None, "DNS 解析失败（{0}）".format(err), ""
              dns = "DNS=" + "/".join(ips)
              try:
                  req = urllib.request.Request(base + path, headers=headers)
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      code, text = resp.status, resp.read().decode("utf-8", "replace")
                  return True, code, "{0}；HTTP {1}".format(dns, code), text
              except urllib.error.HTTPError as err:
                  return True, err.code, "{0}；HTTP {1}".format(dns, err.code), ""
              except Exception as err:
                  return False, None, "{0}；{1}: {2}".format(dns, type(err).__name__, err), ""


          key = os.environ.get("LLM_API_KEY") or ""
          model = os.environ.get("LLM_MODEL") or ""
          z_ok, _z_code, z_desc, _z_text = probe(os.environ.get("ZHIMA_BASE_URL") or "", "/", {})
          l_ok, l_code, l_desc, l_text = probe(os.environ.get("LLM_BASE_URL") or "", "/models",
                                               {"Authorization": "Bearer " + key})
          print("  [自检] 芝麻会话   {0}   {1}".format("可达  " if z_ok else "不可达", z_desc))
          print("  [自检] 模型网关   {0}   {1}".format("可达  " if l_ok else "不可达", l_desc))

          if not z_ok and not l_ok:
              print("::error::芝麻与模型网关都不可达 —— runner 自身出网可能有问题，或两个地址都只在特定网络内可达。")
              sys.exit(1)
          if not l_ok:
              print("::error::只有模型网关不可达（芝麻正常）→ 默认网关是公网可达的百度千帆 v2"
                    "（https://qianfan.baidubce.com/v2，已写死在 workflow env 里，不受 Variables 影响），"
                    "连不上多为 runner 出网/DNS 问题，与脚本、账号、负载无关，加大超时也不会变好。")
              print("::error::若你改过 env 里的 LLM_BASE_URL 指向仅特定网络内可达的地址，"
                    "请改回默认值，或设 RUNNER_LABELS=[\"self-hosted\",\"f2c\"] 把本任务落到能访问它的自托管 runner。")
              sys.exit(1)
          if not z_ok:
              print("::error::只有芝麻会话不可达（模型网关正常）—— 请检查 ZHIMA_BASE_URL 与 runner 到该地址的网络。")
              sys.exit(1)
          if l_code in (401, 403):
              print("::error::模型网关可达但鉴权失败（HTTP {0}）：LLM_API_KEY 无效或已过期。".format(l_code))
              sys.exit(1)
          if l_code not in (None, 200):
              print("::warning::模型网关 /models 返回 HTTP {0}（可能未实现该接口），继续交由 chat/completions 实测。".format(l_code))
          if l_code == 200 and model:
              try:
                  ids = [str(x.get("id")) for x in (json.loads(l_text).get("data") or [])
                         if isinstance(x, dict) and x.get("id")]
                  if ids and model not in ids:
                      print("::warning::LLM_MODEL={0} 不在网关模型列表里（自动路由别名可忽略）：{1}"
                            .format(model, ", ".join(ids[:20])))
              except Exception:
                  pass
          print("[自检] 通过：芝麻会话与模型网关均可达。")
          PY

      # 基线固定取本仓库当前 main 的最新提交（PR 的目标就是它）。
      # ⚠️ 这里**不做 rebase**（2026-09-24 改）：变基要算 origin/BRANCH 与 origin/main 的公共祖先，
      # 会强迫 checkout 拉完整历史 —— 跨境 1.4GB，实测必失败。本分支**只动一个文件**（FAQ_PAGE）。
      #
      # ⚠️ 2026-10-12 修复（第二次）：曾经先用 `git checkout FETCH_HEAD -- <页面>` 整份覆盖，
      # 后改 `git merge-file` 三方合并，两者都被实测证伪（覆盖会回退 main 上的人工修改且每周复发；
      # 三方合并的 base 与 ours 逐字节相同，等于把回退内容当新增重放）。
      # 现在**不再把上期分支的文件写进工作区**：只导出到临时文件，交给脚本按条目续接。
      # 详细踩坑记录见文件头「固定分支的维护方式」。
      - name: Prepare fixed branch
        id: base
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 浅拉基线：只取 tip，不拉历史；显式指定 remote-tracking ref，
          # 保证后面 push --force-with-lease 依据的「本地已知远端值」准确。
          git fetch --no-tags --depth=1 --force origin \
            "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"
          BASE_REF="origin/${BASE_BRANCH}"
          echo "base_ref=${BASE_REF}" >> "$GITHUB_OUTPUT"
          echo "工作基线 ${BASE_REF} = $(git rev-parse --short "${BASE_REF}")"

          # 首跑与续跑都从干净的基线重建固定分支：页面内容永远是 main 的最新版
          git checkout -B "${BRANCH}" "${BASE_REF}"

          # 上期分支只作为「待续接条目」的来源，导出成临时文件即可，**不写入工作区**
          PREV_PAGE_FILE="${RUNNER_TEMP}/community-faq-prev-page.md"
          rm -f "${PREV_PAGE_FILE}"
          echo "prev_page=${PREV_PAGE_FILE}" >> "$GITHUB_OUTPUT"
          # 待续接清单：上期被名额截断的条目（固定分支每轮从 main 重建，页面里没有它们，
          # 这份 sidecar 文件是截断条目唯一的存续通道）。与本轮要写的清单同路径。
          PENDING_FILE="${DOCS_DIR}/faq/community_faq.pending.json"
          echo "pending_file=${PENDING_FILE}" >> "$GITHUB_OUTPUT"
          # 提交步骤（Commit and push）也要用同一路径，导出到 GITHUB_ENV
          echo "PENDING_FILE=${PENDING_FILE}" >> "$GITHUB_ENV"
          echo "pending_prev=" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null 2>&1; then
            echo "固定分支 ${BRANCH} 已存在，导出其上期页面用于条目级续接（main 上的人工修改不受影响）"
            if git fetch --no-tags --depth=1 --force origin \
                 "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" \
               && git show "refs/remotes/origin/${BRANCH}:${FAQ_PAGE}" > "${PREV_PAGE_FILE}" 2>/dev/null; then
              echo "已导出上期页面：$(wc -c < "${PREV_PAGE_FILE}") 字节"
            else
              rm -f "${PREV_PAGE_FILE}"
              echo "::warning::取回上期分支失败，退化为仅在 ${BASE_REF} 上新增（本期将不含上期未合并条目）"
            fi
            # 顺带导出上期待续接清单（若有）；导不出不影响主流程
            PENDING_PREV="${RUNNER_TEMP}/community-faq-pending-prev.json"
            rm -f "${PENDING_PREV}"
            if git show "refs/remotes/origin/${BRANCH}:${PENDING_FILE}" > "${PENDING_PREV}" 2>/dev/null \
               && [ -s "${PENDING_PREV}" ]; then
              echo "pending_prev=${PENDING_PREV}" >> "$GITHUB_OUTPUT"
              echo "已导出上期待续接清单：$(wc -c < "${PENDING_PREV}") 字节"
            else
              echo "上期无待续接清单（或为空）：本轮无被截断的顺延条目"
            fi
          else
            # 远端没有该分支：首跑，或上期 PR 合并后分支被「自动删除分支」清掉了。
            # ⚠️ 自托管 runner 的 workspace 是**持久化**的，本地可能还残留该分支的
            # remote-tracking 引用；不清掉的话，后面 push --force-with-lease 会拿这个过期值
            # 去比对，被误拒为 "stale info"（2026-09-24 实测复现）。
            git update-ref -d "refs/remotes/origin/${BRANCH}" 2>/dev/null || true
            echo "首次运行（或固定分支已被删除），从 ${BASE_REF} 创建分支 ${BRANCH}"
          fi

      - name: Generate community FAQ entries
        id: gen
        env:
          REPORT: ${{ runner.temp }}/community-faq-report.md
          PAIRS: ${{ runner.temp }}/community-faq-pairs.json
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          # 上期固定分支页面（仅用于条目级续接，**绝不覆盖当前页面**，见 Prepare fixed branch）
          PREV_PAGE: ${{ steps.base.outputs.prev_page }}
          # 待续接清单（截断条目 sidecar）：上期输入 / 本轮输出，见 Prepare fixed branch
          PENDING_FILE: ${{ steps.base.outputs.pending_file }}
          PENDING_PREV: ${{ steps.base.outputs.pending_prev }}
        run: |
          set -e
          # BRANCH / FAQ_PAGE / DOCS_DIR 已由 Preflight 导出到 GITHUB_ENV，随产品变化
          APPLY_FLAG="--apply"
          if [ "${DRY_RUN}" = "true" ]; then
            echo "dry_run=true：只预览，不写回页面、不推送、不开 PR"
            APPLY_FLAG=""
          fi

          REUSE_FLAG=""
          if [ -n "${PREV_PAGE}" ] && [ -f "${PREV_PAGE}" ]; then
            echo "发现上期页面 ${PREV_PAGE}，将做条目级续接（只补 main 上还没有的条目）"
            REUSE_FLAG="--reuse-page ${PREV_PAGE}"
          else
            echo "无上期页面可比对（首跑或上期分支已删除），本期按全新生成处理"
          fi
          # 上期待续接清单 + 本轮清单输出（被名额截断的条目落盘，随固定分支提交）
          PENDING_FLAGS="--pending-out ${PENDING_FILE}"
          if [ -n "${PENDING_PREV}" ] && [ -f "${PENDING_PREV}" ]; then
            echo "发现上期待续接清单 ${PENDING_PREV}，本轮优先续接其中条目"
            PENDING_FLAGS="--pending-reuse ${PENDING_PREV} --pending-out ${PENDING_FILE}"
          fi
          # ${REUSE_FLAG} 是按空格拆分的，路径里出现空白字符会拆错参数 —— 先挡住
          case "${PREV_PAGE}" in
            *[[:space:]]*)
              echo "::warning::上期页面路径含空白字符，跳过条目级续接以策安全：${PREV_PAGE}"
              REUSE_FLAG="" ;;
          esac

          set +e
          python3 "${SCRIPT}" \
            --product "${{ matrix.product }}" \
            --days "${{ github.event.inputs.days || '8' }}" \
            --max-items "${{ github.event.inputs.max_items || '5' }}" \
            --min-items "${{ github.event.inputs.min_items || '3' }}" \
            --min-count "${{ github.event.inputs.min_count || '2' }}" \
            --report "${REPORT}" \
            --dump-pairs "${PAIRS}" \
            ${REUSE_FLAG} ${PENDING_FLAGS} \
            ${APPLY_FLAG}
          code=$?
          set -e

          # 退出码含义：0=完成 1=取数失败 2=配置/参数错误 3=无合格新条目
          #             4=大模型环节失败 5=MDX 安全护栏拦截（页面未写入）
          # 只有 3 才算「跑通了但本周没东西可写」；1/2/4/5 一律让 job 失败，
          # 否则接口挂掉会伪装成「本周无新增」，绿色通过、静默跳过一整周。
          # 1 / 4 / 5 分开，是为了让报错指向真正出问题的环节（取数 / 大模型 / MDX 内容）。
          case "${code}" in
            0) : ;;
            3) echo "本周没有合格的新条目，无需提 PR。" ;;
            1) echo "::error::取数失败（退出码 1）：芝麻会话登录失败、接口异常，或所有群都没取到消息。请检查 ZHIMA_BASE_URL / 账号，以及 runner 能否访问该地址。"
               exit 1 ;;
            2) echo "::error::配置或参数错误（退出码 2）[${{ matrix.product }}]：请核对 Secrets/Variables，以及 ${FAQ_PAGE} 是否存在。"
               exit 2 ;;
            4) echo "::error::大模型环节失败（退出码 4）：无法访问模型网关 ${LLM_BASE_URL}、LLM_API_KEY 无效，或模型无返回。"
               echo "::error::网关与模型名已写死在 workflow env 里，不受仓库 Variables 影响 —— 优先核对 LLM_API_KEY 是否为有效的千帆 API Key（形如 bce-v3/ALTAK-xxxx/yyyy）。"
               echo "::error::若错误信息里含 thinking / HTTP 400，检查 LLM_DISABLE_REASONING 是否被设成了 0（本模型默认必须关闭思维链，否则预算被 reasoning 吃光、正文为空）。"
               echo "::error::若报 TCP 连接超时且你改过 env 里的 LLM_BASE_URL（如换成仅国内可达的自建网关），把 RUNNER_LABELS 设为 [\"self-hosted\",\"f2c\"] 落到国内自托管 runner。"
               exit 4 ;;
            5) echo "::error::MDX 安全护栏拦截（退出码 5）：生成的条目经转义后仍无法通过 MDX 编译，页面**未被修改**。"
               echo "::error::这意味着模型写出了护栏尚未覆盖的 MDX 危险写法，请查看上面的「整页 MDX 校验」日志定位具体报错，"
               echo "::error::并补充 .github/scripts/community_faq.py 里的 _MDX_DANGER_PATTERNS / sanitize_mdx_text。切勿直接把内容合进 main，否则整站发布（Deploy to Aliyun OSS）会失败。"
               exit 5 ;;
            *) echo "::error::community_faq.py 异常退出（退出码 ${code}）"
               exit "${code}" ;;
          esac

          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          echo "report=${REPORT}" >> "$GITHUB_OUTPUT"
          # 报告**无条件**写入 Actions 摘要：定时跑出的「本周无新增」也要能看到原因
          # （哪些主题入选、逐条因何被拒），否则每周只能靠翻日志猜。
          if [ -f "${REPORT}" ]; then
            { echo; echo "---"; echo; cat "${REPORT}"; } >> "$GITHUB_STEP_SUMMARY"
            cat "${REPORT}"
          fi

      # 诊断产物：问答对 + 生成报告，便于排查「模型没选中任何问题」与
      # 「选中了但逐条被拒」两种情形（需 `if: always()`，失败时也要落盘）。
      # ⚠️ 产物名必须带产品：矩阵 job 并发上传时，同名 artifact 会直接 409 冲突，
      #    导致后到的 job 上传失败（早期单产品版本写死 community-faq-diagnostics 就是这个原因）。
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-faq-diagnostics-${{ matrix.product }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ${{ runner.temp }}/community-faq-report.md
            ${{ runner.temp }}/community-faq-pairs.json

      - name: Commit and push
        id: commit
        if: ${{ steps.gen.outputs.changed == 'true' }}
        run: |
          set -e
          if [ -z "$(git status --porcelain -- "${FAQ_PAGE}" "${PENDING_FILE}")" ]; then
            echo "页面与待续接清单均无变化，跳过提交"
            exit 0
          fi

          git add "${FAQ_PAGE}"
          # 待续接清单：被名额截断的条目的存续通道（页面无变化时也可能只有清单变化）
          if git status --porcelain -- "${PENDING_FILE}" | grep -q .; then
            git add "${PENDING_FILE}"
          fi
          git commit -m "docs(faq): 补充本周社区常见问题"

          # 推送：显式给出租约的「期望值」，不用裸 --force-with-lease。
          # 2026-09-24 实测：裸写法在「远程跟踪引用不是由配置的 refspec 更新」时会误报
          # "stale info"（本地租约值与远端实际值明明相同却拒绝）；写成 <ref>:<sha> 稳定通过。
          # 写成显式值还有一个好处：若有人往固定分支推过东西，这里会如实拒绝，而不是覆盖别人的提交。
          if git rev-parse --verify -q "origin/${BRANCH}" >/dev/null; then
            git push --force-with-lease="refs/heads/${BRANCH}:$(git rev-parse "origin/${BRANCH}")" \
              origin "${BRANCH}"
          else
            # 固定分支尚不存在（首跑）：普通推送即可，无需 force
            git push origin "${BRANCH}"
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # ⚠️ **不用 gh CLI**（2026-09-24 实测）：自托管 runner 是自建镜像，里面没有 gh →
      # `line 20: gh: command not found`、退出码 127。装 gh 又要重建镜像 + 再走一次跨境下载，
      # 而容器里本来就有 python3（Preflight 已在用）→ 改用标准库直接调 GitHub REST API，
      # 零新依赖、workspace 与镜像都不用动。
      # 权限要求与 gh 相同：Settings -> Actions -> General 勾选
      # "Allow GitHub Actions to create and approve pull requests"，否则会返回
      # "Resource not accessible by integration"（脚本会把这句提示打到日志里）。
      - name: Create or update pull request
        id: pr
        if: ${{ steps.commit.outputs.pushed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAYS: ${{ github.event.inputs.days || '8' }}
          DRAFT: ${{ github.event.inputs.draft || 'true' }}
          # 产品名（与脚本 PRODUCTS[key]['name'] 同源）——用于 PR 标题/描述区分开六个产品的 PR
          PRODUCT: ${{ matrix.product }}
          # 双复核责任人（Preflight 解析自 PRODUCTS 表 / 轮换表）
          OWNER_LOGIN: ${{ env.OWNER_LOGIN }}
          ONCALL_LOGIN: ${{ env.ONCALL_LOGIN }}
        run: |
          set -e
          echo "PR 目标: ${GITHUB_REPOSITORY}  ${BASE_BRANCH} <- ${BRANCH}（draft=${DRAFT}，product=${PRODUCT}）"
          python3 - <<'PY'
          import datetime, json, os, sys, urllib.error, urllib.request

          TOKEN = os.environ["GH_TOKEN"]
          REPO = os.environ["GITHUB_REPOSITORY"]              # owner/name
          API = os.environ.get("GITHUB_API_URL") or "https://api.github.com"
          BASE = os.environ["BASE_BRANCH"]
          BRANCH = os.environ["BRANCH"]
          PAGE = os.environ["FAQ_PAGE"]
          DAYS = os.environ.get("DAYS") or "8"
          PRODUCT = (os.environ.get("PRODUCT") or "").strip() or "jumpserver"
          DRAFT = (os.environ.get("DRAFT") or "true").strip().lower() == "true"
          OWNER = REPO.split("/")[0]
          # 双复核：产品负责人（各产品固定）+ 当周社区值班人（按周轮换）
          OWNER_LOGIN = (os.environ.get("OWNER_LOGIN") or "").strip().lstrip("@")
          ONCALL_LOGIN = (os.environ.get("ONCALL_LOGIN") or "").strip().lstrip("@")
          # 去重：本周值班人恰好就是产品负责人时只挂一位（否则 API 会因重复而报 422）
          REVIEWERS = []
          for who in (OWNER_LOGIN, ONCALL_LOGIN):
              if who and who not in REVIEWERS:
                  REVIEWERS.append(who)
          SAME_PERSON = bool(OWNER_LOGIN) and OWNER_LOGIN == ONCALL_LOGIN


          def api(method, path, payload=None):
              """返回 (status, parsed_json_or_text)；4xx/5xx 不抛异常，交给调用方判断。"""
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(API + path, data=data, method=method)
              req.add_header("Authorization", "Bearer " + TOKEN)
              req.add_header("Accept", "application/vnd.github+json")
              req.add_header("X-GitHub-Api-Version", "2022-11-28")
              req.add_header("User-Agent", "fit2cloud-docs-community-faq")
              if data is not None:
                  req.add_header("Content-Type", "application/json")
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      raw = resp.read().decode("utf-8", "replace")
                      return resp.status, (json.loads(raw) if raw.strip() else None)
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read().decode("utf-8", "replace")


          # ---- 组装 PR 描述（精简版：完整报告只进 Actions 摘要，不进 PR body）----
          lines = [
              "自动从社区交流群沉淀的本周常见问题，**请人工核对内容与措辞后再合并**。",
              "",
              "- 产品：`%s`" % PRODUCT,
              "- 数据来源：芝麻会话（该产品交流群）、最近 %s 天" % DAYS,
              "- 生成方式：`.github/scripts/community_faq.py` 依据官方文档改写后追加",
              "- 目标文件：`%s`" % PAGE,
              "- 提交分支：`%s`" % BRANCH,
              "",
              "本期新增条目见右侧「文件改动」diff；选题依据、质量警告等生成细节见本次运行的 "
              "Actions 摘要（Summary），此处不再重复。",
              "",
              "### 双复核（两人 Approve 后任意一人可合并）",
              "",
          ]
          if OWNER_LOGIN:
              lines.append("- [ ] 产品负责人 @%s 复核" % OWNER_LOGIN)
          else:
              lines.append("- [ ] 产品负责人复核（⚠️ PRODUCTS 表未配置 owner，请补）")
          if SAME_PERSON:
              lines.append("- [x] 当周社区值班人：本周值班人与产品负责人同为 @%s，无需二次挂人" % OWNER_LOGIN)
          elif ONCALL_LOGIN:
              lines.append("- [ ] 当周社区值班人 @%s 复核" % ONCALL_LOGIN)
          else:
              lines.append("- [ ] 当周社区值班人复核（⚠️ ONCALL_ROTA 未覆盖本周，请补充轮换表）")
          lines.append("")
          body = "\n".join(lines)

          # 按北京时间取日期（job 级 TZ=Asia/Shanghai）；标题前缀带产品，
          # 六个产品同时开 PR 时一眼能从列表里分清哪条是哪个产品的。
          title = "docs(faq): 补充社区常见问题（%s %s）" % (
              PRODUCT, datetime.date.today().isoformat())

          # ---- 查是否已有开启中的 PR：列 open PR 后按 head 自行过滤 ----
          # 不用 ?head=owner:branch（分支名带 / 时参数转义容易出岔子），自己比 head.ref 更稳
          status, prs = api("GET", "/repos/%s/pulls?state=open&per_page=100" % REPO)
          if status != 200:
              print("::error::列取开启中的 PR 失败（HTTP %s）：%s" % (status, prs))
              sys.exit(1)
          existing = None
          for pr in (prs or []):
              head = pr.get("head") or {}
              if head.get("ref") == BRANCH and (head.get("repo") or {}).get("full_name") == REPO:
                  existing = pr
                  break

          if existing:
              num = existing["number"]
              print("已有开启中的 PR #%d，更新标题与描述" % num)
              status, res = api("PATCH", "/repos/%s/pulls/%d" % (REPO, num),
                                {"title": title, "body": body})
              # 已开 PR 的 reviewer 只能单独请求；重复请求已挂的人会被忽略，不影响流程
              if REVIEWERS and status in (200, 201):
                  st2, r2 = api("POST", "/repos/%s/pulls/%d/requested_reviewers" % (REPO, num),
                                {"reviewers": REVIEWERS})
                  if st2 not in (200, 201):
                      print("::warning::挂 reviewer 失败（HTTP %s）：%s" % (st2, r2))
          else:
              print("新建 PR（draft=%s）" % DRAFT)
              payload = {"title": title, "body": body, "head": BRANCH,
                         "base": BASE, "draft": DRAFT}
              if REVIEWERS:
                  payload["requested_reviewers"] = REVIEWERS
              status, res = api("POST", "/repos/%s/pulls" % REPO, payload)

          if status not in (200, 201):
              print("::error::创建/更新 PR 失败（HTTP %s）：%s" % (status, res))
              print("::error::若提示 Resource not accessible by integration，请到仓库 "
                    "Settings -> Actions -> General 勾选 "
                    "\"Allow GitHub Actions to create and approve pull requests\"。")
              sys.exit(1)

          num = res["number"]
          url = res["html_url"]
          print("PR #%d %s（reviewers=%s）" % (num, url, ",".join(REVIEWERS) or "无"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("pr_number=%d\npr_url=%s\n" % (num, url))

          # draft 输入为 false 时，把草稿态转成可合并
          if not DRAFT and res.get("draft"):
              status, err = api("POST", "/repos/%s/pulls/%d/ready_for_review" % (REPO, num))
              if status in (200, 201):
                  print("已转为可合并状态")
              else:
                  print("::warning::转为可合并失败（HTTP %s）：%s" % (status, err))
          PY

      - name: Summary
        if: always()
        run: |
          {
            echo "### Auto Community FAQ (${{ matrix.product }})"
            echo ""
            echo "- 仓库: \`${GITHUB_REPOSITORY}\`"
            echo "- 产品: \`${{ matrix.product }}\`"
            echo "- 窗口: 最近 \`${{ github.event.inputs.days || '8' }}\` 天（含今天，按北京时间）"
            echo "- 工作基线: \`${{ steps.base.outputs.base_ref || '-' }}\`"
            echo "- FAQ 页面: \`${{ steps.preflight.outputs.page || '-' }}\`"
            echo "- 固定分支: \`${{ steps.preflight.outputs.branch || '-' }}\`"
            echo "- 脚本退出码: \`${{ steps.gen.outputs.exit_code || '-' }}\`（0=完成，1=取数失败，2=配置或参数错误，3=无合格新条目，4=大模型环节失败，5=MDX 安全护栏拦截）"
            echo "- 本轮推送: \`${{ steps.commit.outputs.pushed || 'false' }}\`"
            echo "- 本轮 PR: ${{ steps.pr.outputs.pr_url || '-' }}"
          } >> "$GITHUB_STEP_SUMMARY"
