name: Check JS Latest Version

on:
  workflow_dispatch:
  schedule:
    # 每日 20:00 UTC（北京时间凌晨 4 点）检查一次
    - cron: "0 20 * * *"

# 允许工作流把 bot 改好的文档 push 回仓库，否则最后一步 git push 会 403
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Get Version
        run: |
          # 过滤预发布版：只取正式版 latest，避免把 beta/rc 版本号写进正式文档
          version=$(curl -s https://api.github.com/repos/jumpserver/installer/releases/latest | jq -r 'select(.prerelease==false) | .tag_name')
          echo "Latest JumpServer installer tag: ${version}"
          # 校验：必须是 v 开头的版本号，否则(API 限流/异常)立即中止，避免污染文档
          if [ -z "${version}" ] || [ "${version}" = "null" ] || ! echo "${version}" | grep -q '^v'; then
            echo "Invalid or missing version (API error / rate limit?), aborting."
            exit 1
          fi
          # 去掉前缀 v 得到包名里的版本号: v5.0.0 -> 5.0.0
          bare=$(echo "${version}" | sed 's/^v//')
          echo "bare=${bare}" >> $GITHUB_ENV
          grep -q "jumpserver-ce-${bare}-x86_64" \
            content/jumpserver/v5/zh/installation/setup_linux_standalone/offline_install.mdx \
            || echo "update=true" >> $GITHUB_ENV

      - name: Update Version in Docs
        if: env.update == 'true'
        run: |
          # 把两篇离线文档里的 jumpserver-ce-<旧版本>-x86_64 统一改成 <新版本>
          # 版本号段用 [^-]* 非贪婪匹配，避免跨越 -x86_64 误吞表格单元格里的 .tar.gz
          for f in \
            content/jumpserver/v5/zh/installation/setup_linux_standalone/offline_install.mdx \
            content/jumpserver/v5/zh/installation/setup_linux_standalone/offline_upgrade.mdx; do
            sed -i -E "s@jumpserver-ce-[^-]*-x86_64@jumpserver-ce-${{ env.bare }}-x86_64@g" "$f"
          done
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add content/jumpserver/v5/zh/installation/setup_linux_standalone/offline_install.mdx \
                  content/jumpserver/v5/zh/installation/setup_linux_standalone/offline_upgrade.mdx
          git commit -m "chore(docs): update offline installer version to ${{ env.bare }}"
          git push
